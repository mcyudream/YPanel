services:
  neo4j:
    image: neo4j:5.20-community
    container_name: ${CONTAINER_NAME}
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    ports:
      - "${PANEL_APP_PORT_HTTP}:7474"
      - "${PANEL_APP_PORT_BOLT}:7687"
    volumes:
      - ./data:/data
    networks:
      - 1panel-network
    restart: unless-stopped

networks:
  1panel-network:
    external: true
