name: Release

# 推送 vX.Y.Z tag 触发：构建前端产物 → embed → 交叉编译 linux amd64/arm64（core+agent）
# → 打包 + sha256 → 创建 GitHub Release → 独立任务镜像到 GitLab。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter './apps/*' -r exec vite build

      - name: Sync embed dist
        run: |
          rm -rf core/internal/web/dist
          cp -r web/apps/core-arco-design-vue/dist core/internal/web/dist
          test -f core/internal/web/dist/index.html

      - name: Build binaries (linux amd64/arm64)
        working-directory: core
        run: |
          VER="${GITHUB_REF_NAME}"
          mkdir -p "$GITHUB_WORKSPACE/build"
          for ARCH in amd64 arm64; do
            DIR="$GITHUB_WORKSPACE/build/ypanel-linux-${ARCH}"
            mkdir -p "$DIR"
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH \
              go build -ldflags "-s -w -X main.version=$VER" -o "$DIR/ypanel" ./cmd/ypanel
            (cd ../agent && CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH \
              go build -ldflags "-s -w -X main.version=$VER" -o "$DIR/ypagent" ./cmd/agent)
            tar -czf "$GITHUB_WORKSPACE/build/ypanel-linux-${ARCH}.tar.gz" -C "$DIR" ypanel ypagent
          done
          (cd "$GITHUB_WORKSPACE/build" && sha256sum *.tar.gz > sha256sums.txt)
          ls -la "$GITHUB_WORKSPACE/build/"

      - name: Smoke test binaries
        working-directory: build
        run: |
          chmod +x ypanel-linux-amd64/ypanel ypanel-linux-amd64/ypagent
          ypanel-linux-amd64/ypanel version | grep -q "${GITHUB_REF_NAME}" || { echo "version mismatch"; exit 1; }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ypanel-release
          path: |
            build/*.tar.gz
            build/sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.tar.gz
            build/sha256sums.txt
          generate_release_notes: true

  mirror-gitlab:
    needs: release
    uses: ./.github/workflows/mirror-gitlab.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
